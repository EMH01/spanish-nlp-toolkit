[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spanish-nlp-toolkit"
version = "0.1.0"
description = "Spanish NLP toolkit for topic clustering and lexical sentiment analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.26",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "spacy>=3.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spanish_nlp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
